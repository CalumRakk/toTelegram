repos:
  # Hooks estándar de limpieza
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
  - repo: local
    hooks:
      - id: compile-locales
        name: Compilar catálogos i18n
        entry: .venv/bin/python -m babel.messages.frontend compile -d totelegram/locales -D totelegram
        language: system
        pass_filenames: false
        always_run: true

      - id: run-tests
        name: Ejecutar Tests Unitarios
        entry: .venv/bin/python -m unittest discover tests
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
